<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <radialGradient id="bg" cx="50%" cy="40%" r="80%">
      <stop offset="0%" stop-color="#1c1f33"/>
      <stop offset="100%" stop-color="#0a0a14"/>
    </radialGradient>
    <linearGradient id="hash" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#c8d2ff"/>
      <stop offset="100%" stop-color="#8b9eff"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="14"/>
      <feOffset dx="0" dy="8"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.45"/></feComponentTransfer>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background squircle (Apple-style) -->
  <rect x="0" y="0" width="1024" height="1024" rx="232" ry="232" fill="url(#bg)"/>

  <!-- Subtle inner highlight -->
  <rect x="8" y="8" width="1008" height="1008" rx="226" ry="226" fill="none" stroke="rgba(255,255,255,0.06)" stroke-width="2"/>

  <!-- Hash mark: tilted vertical bars + straight horizontal bars -->
  <g filter="url(#glow)" fill="url(#hash)">
    <!-- Left vertical bar, slight italic lean -->
    <path d="M 358 168
             L 422 168
             L 354 856
             L 290 856
             Z" />
    <!-- Right vertical bar -->
    <path d="M 666 168
             L 730 168
             L 662 856
             L 598 856
             Z" />
    <!-- Top horizontal bar -->
    <rect x="160" y="372" width="704" height="76" rx="14" />
    <!-- Bottom horizontal bar -->
    <rect x="160" y="576" width="704" height="76" rx="14" />
  </g>
</svg>
